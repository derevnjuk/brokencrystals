services:
  db:
    image: 'postgres:16-alpine'
    restart: always
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      timeout: 45s
    environment:
      POSTGRES_DB: bc
      POSTGRES_USER: bc
      POSTGRES_PASSWORD: bc
    ports:
      - '5432:5432'
    volumes:
      - './pg.sql:/docker-entrypoint-initdb.d/pg.sql'
      - 'db_data:/var/lib/postgresql/data/'

  nodejs:
    # image: dull/pureflow  # replaced — must build from source
    build:
      context: .
    restart: on-failure
    healthcheck:
      interval: 5s
      retries: 10
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/api/config']
      timeout: 30s
      start_period: 120s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DISABLE_HTTPS: 'true'
      CHAT_API_URL: http://ollama:11434/v1/chat/completions
      CHAT_API_MODEL: smollm:135m
      CHAT_API_TOKEN: ''
      CHAT_API_MAX_TOKENS: 200
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: 2.0
    logging:
      options:
        max-file: '5'
        max-size: '10m'
    depends_on:
      db:
        condition: service_healthy
      mailcatcher:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - '3000:3000'

  keycloak-db:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      timeout: 45s
    restart: on-failure
    volumes:
      - 'keycloak_db_data:/var/lib/postgresql/data/'

  keycloak:
    image: 'quay.io/keycloak/keycloak:25.0'
    volumes:
      - './keycloak/imports/realm-export.json:/opt/keycloak/data/import/realm-export.json'
    command: start-dev --import-realm
    ports:
      - '8080:8080'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Pa55w0rd
      KC_HEALTH_ENABLED: true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e \"GET /health/ready HTTP/1.1\r\nhost: 127.0.0.1:9000\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3"
        ]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 5s
    depends_on:
      keycloak-db:
        condition: service_healthy

  mailcatcher:
    image: 'axllent/mailpit:v1.20'
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8025']
      timeout: 45s
    restart: always
    ports:
      - '1080:8025'
      - '1025:1025'
    logging:
      options:
        max-file: '5'
        max-size: '10m'

  ollama:
    image: 'ollama/ollama:0.3.14'
    restart: always
    healthcheck:
      interval: 30s
      retries: 5
      test: ['CMD', 'ollama', 'list']
      timeout: 10s
      start_period: 60s
    ports:
      - '11434:11434'
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: 2.0
    logging:
      options:
        max-file: '5'
        max-size: '10m'

volumes:
  db_data:
  keycloak_db_data:
  letsencrypt:
