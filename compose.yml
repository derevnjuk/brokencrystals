services:
  db:
    image: 'postgres:17-alpine'
    restart: always
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      timeout: 45s
    environment:
      POSTGRES_DB: bc
      POSTGRES_USER: bc
      POSTGRES_PASSWORD: bc
    ports:
      - '5432:5432'
    volumes:
      - './pg.sql:/docker-entrypoint-initdb.d/pg.sql'
      - '.data/nodejs:/var/lib/postgresql/data/'

  nodejs:
    # image: dull/pureflow  # replaced — must build from source
    build:
      context: .
    ports:
      - '3000:3000'
    restart: on-failure
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 120s
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/api/config']
      timeout: 30s
    environment:
      NODE_ENV: development
      URL: http://localhost:3000
      DATABASE_HOST: db
      DATABASE_SCHEMA: bc
      DATABASE_USER: bc
      DATABASE_PASSWORD: bc
      DATABASE_PORT: 5432
      DATABASE_DEBUG: 'true'
      AWS_BUCKET: https://neuralegion-open-bucket.s3.amazonaws.com
      GOOGLE_MAPS_API: AIzaSyD2wIxpYCuNI0Zjt8kChs2hLTS5abVQfRQ
      JWT_PRIVATE_KEY_LOCATION: config/keys/jwtRS256.key
      JWT_PUBLIC_KEY_LOCATION: config/keys/jwtRS256.key.pub.pem
      JWT_SECRET_KEY: '1234'
      JWK_PRIVATE_KEY_LOCATION: config/keys/jwk.key.pem
      JWK_PUBLIC_KEY_LOCATION: config/keys/jwk.pub.key.pem
      JWK_PUBLIC_JSON: config/keys/jwk.pub.json
      JKU_URL: https://raw.githubusercontent.com/NeuraLegion/pureflow/stable/config/keys/jku.json
      X5U_URL: https://raw.githubusercontent.com/NeuraLegion/pureflow/stable/config/keys/x509.crt
      FASTIFY_LOGGER: 'true'
      FASTIFY_LOG_LEVEL: warn
      KEYCLOAK_SERVER_URI: http://keycloak:8080
      KEYCLOAK_REALM: pureflow
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_CLIENT_SECRET: 3abff4a7-6649-4bae-a105-9bd1fb52a2cd
      KEYCLOAK_PUBLIC_CLIENT_ID: pureflow-client
      KEYCLOAK_PUBLIC_CLIENT_SECRET: 4bfb5df6-4647-46dd-bad1-c8b8ffd7caf4
      CHAT_API_URL: http://ollama:11434/v1/chat/completions
      CHAT_API_MODEL: smollm:135m
      CHAT_API_TOKEN: ''
      CHAT_API_MAX_TOKENS: 200
    logging:
      options:
        max-file: '5'
        max-size: '10m'
    depends_on:
      - db
      - keycloak
      - mailcatcher
      - ollama

  keycloak-db:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      interval: 10s
      retries: 10
      test: ['CMD-SHELL', 'pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}']
      timeout: 45s
    restart: on-failure
    volumes:
      - '.data/keycloak:/var/lib/postgresql/data/'

  keycloak:
    image: 'quay.io/keycloak/keycloak:26.1.2'
    command: ['start-dev', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    depends_on:
      - keycloak-db
    ports:
      - '8080:8080'
    volumes:
      - './keycloak/imports:/opt/keycloak/data/import'

  mailcatcher:
    image: 'mailhog/mailhog:v1.0.1'
    ports:
      - '1025:1025'
      - '1080:1080'

  ollama:
    image: 'ollama/ollama:0.6.5'
    restart: on-failure
    ports:
      - '11434:11434'

volumes:
  letsencrypt:
