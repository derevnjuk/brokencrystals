name: star-mcp-workspace

# Triggered by the push that adds the workspace files (done by Star's StartWorkspace
# activity). Scoped with a paths filter so later commits on this branch (security fixes,
# test changes, etc.) do not re-trigger and spawn duplicate MCP server connections.
on:
  push:
    branches:
      - 'bright/357dae41-e02a-506f-a47f-baf9e4dfd9d1'
    paths:
      - '.bright/mcp-workspace-server/**'
      - '.github/workflows/star-mcp-workspace.yml'

# id-token: write mints the OIDC JWT for the Bright token exchange; contents: write lets the
# commit_changes tool push the agent's applied edits back to the branch; actions: write is
# required to push changes under .github/workflows/.
permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRIGHT_HOSTNAME: 'development.playground.brightsec.com'
      BRIGHT_PROJECT_ID: '2tiBS9X13Ps5BkKzBdbWgj'
    steps:
      # commit_changes pushes the agent's edits back to the branch. The default GITHUB_TOKEN
      # is forbidden by GitHub from creating/updating files under .github/workflows/, so to
      # commit workflow-file fixes a PAT (or App token) with the `workflow` scope must be
      # supplied as the STAR_GITHUB_TOKEN secret. Falls back to the default token otherwise
      # (non-workflow fixes still push fine).
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.STAR_GITHUB_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Workload Identity Federation: RFC 8693 token exchange.
      # https://docs.brightsec.com/docs/workload-identity-federation
      - name: Exchange OIDC token for Bright token
        shell: bash
        run: |
          set -euo pipefail

          OIDC_TOKEN=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value // empty')
          if [ -z "${OIDC_TOKEN}" ]; then
            echo "Error: could not obtain GitHub OIDC token." >&2
            exit 1
          fi

          BRIGHT_BASE_URL="https://${BRIGHT_HOSTNAME}"

          # resource pins the exchange to this exact project so the token cannot match a
          # WIF configuration in another Bright project.
          exchange_payload=$(jq -n \
            --arg token "${OIDC_TOKEN}" \
            --arg resource "${BRIGHT_BASE_URL}/api/v1/projects/${BRIGHT_PROJECT_ID}" \
            '{
              grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
              subject_token: $token,
              subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              resource: $resource
            }')

          exchange_response=$(curl -sS --fail-with-body \
            -X POST "${BRIGHT_BASE_URL}/api/v1/token" \
            -H 'Content-Type: application/json' \
            --data "${exchange_payload}")

          BRIGHT_TOKEN=$(jq -r '.access_token // empty' <<< "${exchange_response}")
          if [ -z "${BRIGHT_TOKEN}" ]; then
            echo "Error: OIDC exchange response did not include access_token." >&2
            exit 1
          fi

          echo "::add-mask::${BRIGHT_TOKEN}"
          echo "BRIGHT_TOKEN=${BRIGHT_TOKEN}" >> "$GITHUB_ENV"

      - name: Install MCP server deps
        run: npm install
        working-directory: .bright/mcp-workspace-server

      # Pre-install the Bright CLI globally so repeater processes invoke a single shared
      # binary. Installing it per-repeater via `npx` races on the shared npm cache when
      # several repeaters start concurrently and fails with ENOTEMPTY.
      - name: Install Bright CLI
        run: npm install -g @brightsec/cli

      - name: Run MCP workspace server
        env:
          STAR_WS_URL: 'wss://nicely-picked-quail.ngrok-free.app/star/mcp-workspace'
          RUN_ID: '357dae41-e02a-506f-a47f-baf9e4dfd9d1'
          STAR_WS_TOKEN: ${{ env.BRIGHT_TOKEN }}
          WORKDIR: ${{ github.workspace }}
        run: npx tsx src/index.ts
        working-directory: .bright/mcp-workspace-server

      # Posthook: revoke the temporary Bright access token once the job is done, per
      # RFC 7009. Runs even if earlier steps failed. Non-fatal on its own failure.
      - name: Revoke Bright token
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${BRIGHT_TOKEN:-}" ]; then
            echo "No Bright token to revoke."
            exit 0
          fi

          revoke_payload=$(jq -n --arg token "${BRIGHT_TOKEN}" \
            '{ token: $token, token_type_hint: "access_token" }')

          curl -sS --fail-with-body \
            -X POST "https://${BRIGHT_HOSTNAME}/api/v1/revoke" \
            -H 'Content-Type: application/json' \
            --data "${revoke_payload}" || echo "Revoke request failed (non-fatal)."

  # SCIP indexing runs in parallel with the workspace server. It produces standard SCIP
  # indexes with the scip-* toolchain and uploads them to Bright, which ingests them into
  # the dependency graph. The bulk index travels over REST (not the MCP WebSocket).
  scip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRIGHT_HOSTNAME: 'development.playground.brightsec.com'
      BRIGHT_PROJECT_ID: '2tiBS9X13Ps5BkKzBdbWgj'
      STAR_API_URL: 'https://nicely-picked-quail.ngrok-free.app'
      REPO_ID: 'github.com/derevnjuk/pureflow'
      HEAD_SHA: 'c6b80e75351644dcc2f54dd41729b54ca45a0707'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Exchange OIDC token for Bright token
        shell: bash
        run: |
          set -euo pipefail

          OIDC_TOKEN=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value // empty')
          if [ -z "${OIDC_TOKEN}" ]; then
            echo "Error: could not obtain GitHub OIDC token." >&2
            exit 1
          fi

          exchange_payload=$(jq -n \
            --arg token "${OIDC_TOKEN}" \
            --arg resource "https://${BRIGHT_HOSTNAME}/api/v1/projects/${BRIGHT_PROJECT_ID}" \
            '{
              grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
              subject_token: $token,
              subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              resource: $resource
            }')

          exchange_response=$(curl -sS --fail-with-body \
            -X POST "https://${BRIGHT_HOSTNAME}/api/v1/token" \
            -H 'Content-Type: application/json' \
            --data "${exchange_payload}")

          BRIGHT_TOKEN=$(jq -r '.access_token // empty' <<< "${exchange_response}")
          if [ -z "${BRIGHT_TOKEN}" ]; then
            echo "Error: OIDC exchange response did not include access_token." >&2
            exit 1
          fi

          echo "::add-mask::${BRIGHT_TOKEN}"
          echo "BRIGHT_TOKEN=${BRIGHT_TOKEN}" >> "$GITHUB_ENV"

      - name: Index TypeScript (scip-typescript)
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f tsconfig.json ] && [ ! -f package.json ]; then
            echo "No TypeScript project detected; skipping."
            exit 0
          fi
          npm install -g @sourcegraph/scip-typescript >/dev/null 2>&1 || { echo "install failed"; exit 0; }
          npm install >/dev/null 2>&1 || true
          if scip-typescript index --output index-ts.scip && [ -s index-ts.scip ]; then
            curl -sS --fail-with-body -X POST \
              "${STAR_API_URL}/star/scip?repoId=${REPO_ID}&sha=${HEAD_SHA}&tool=scip-typescript" \
              -H "Authorization: Bearer ${BRIGHT_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @index-ts.scip
          else
            echo "scip-typescript produced no index; skipping upload."
          fi

      - name: Index Go (scip-go)
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f go.mod ]; then
            echo "No Go module detected; skipping."
            exit 0
          fi
          go install github.com/sourcegraph/scip-go/cmd/scip-go@latest || { echo "install failed"; exit 0; }
          if "$(go env GOPATH)/bin/scip-go" --output index-go.scip && [ -s index-go.scip ]; then
            curl -sS --fail-with-body -X POST \
              "${STAR_API_URL}/star/scip?repoId=${REPO_ID}&sha=${HEAD_SHA}&tool=scip-go" \
              -H "Authorization: Bearer ${BRIGHT_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @index-go.scip
          else
            echo "scip-go produced no index; skipping upload."
          fi

      - name: Signal indexing complete
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST \
            "${STAR_API_URL}/star/scip/complete?repoId=${REPO_ID}&sha=${HEAD_SHA}" \
            -H "Authorization: Bearer ${BRIGHT_TOKEN}"

      - name: Revoke Bright token
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${BRIGHT_TOKEN:-}" ]; then exit 0; fi
          curl -sS --fail-with-body -X POST "https://${BRIGHT_HOSTNAME}/api/v1/revoke" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg token "${BRIGHT_TOKEN}" '{ token: $token, token_type_hint: "access_token" }')" \
            || echo "Revoke failed (non-fatal)."
