name: star-mcp-workspace

# Triggered by the push that adds the workspace files (done by Star's StartWorkspace
# activity). Scoped with a paths filter so later commits on this branch (security fixes,
# test changes, etc.) do not re-trigger and spawn duplicate MCP server connections.
on:
  push:
    branches:
      - "bright/357dae41-e02a-506f-a47f-baf9e4dfd9d1"
    paths:
      - ".bright/mcp-workspace-server/**"
      - ".github/workflows/star-mcp-workspace.yml"

# id-token: write is required to mint the GitHub OIDC JWT that is exchanged for a
# short-lived Bright token (no long-lived secret needed).
permissions:
  contents: read
  id-token: write

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Exchange OIDC token for Bright token
        shell: bash
        env:
          BRIGHT_HOSTNAME: "development.playground.brightsec.com"
          BRIGHT_PROJECT_ID: "2tiBS9X13Ps5BkKzBdbWgj"
        run: |
          set -euo pipefail

          # 1) Mint the GitHub OIDC JWT.
          OIDC_RESPONSE=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")
          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value // empty')
          if [ -z "$OIDC_TOKEN" ]; then
            echo "Error: could not obtain GitHub OIDC token. Response: $OIDC_RESPONSE" >&2
            exit 1
          fi

          # 2) Exchange it for a Bright token. Capture status + body separately so a
          #    non-JSON error page (gateway/404) produces a clear message instead of an
          #    opaque jq parse error.
          EXCHANGE_URL="https://${BRIGHT_HOSTNAME}/api/v1/projects/${BRIGHT_PROJECT_ID}/api-keys/oidc"
          HTTP_RESPONSE=$(curl -sS -w $'\n%{http_code}' -X POST "$EXCHANGE_URL" \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"${OIDC_TOKEN}\"}")
          HTTP_CODE=$(printf '%s' "$HTTP_RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$HTTP_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Error: Bright OIDC exchange failed (HTTP $HTTP_CODE) at $EXCHANGE_URL" >&2
            echo "Response body: $BODY" >&2
            exit 1
          fi

          PURE_KEY=$(echo "$BODY" | jq -r '.pureKey // empty')
          if [ -z "$PURE_KEY" ]; then
            echo "Error: no pureKey in Bright response: $BODY" >&2
            exit 1
          fi

          echo "::add-mask::$PURE_KEY"
          echo "BRIGHT_TOKEN=$PURE_KEY" >> "$GITHUB_ENV"

      - name: Install MCP server deps
        run: npm install
        working-directory: .bright/mcp-workspace-server

      - name: Run MCP workspace server
        env:
          STAR_WS_URL: "development.playground.brightsec.com"
          RUN_ID: "357dae41-e02a-506f-a47f-baf9e4dfd9d1"
          STAR_WS_TOKEN: ${{ env.BRIGHT_TOKEN }}
          WORKDIR: ${{ github.workspace }}
        run: npx tsx src/index.ts
        working-directory: .bright/mcp-workspace-server
